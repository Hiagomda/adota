# Cabeçalhos do app web (/app). Diferem dos da página de download só no Permissions-Policy: o app
# usa câmera e localização para o alerta de resgate, sempre do próprio site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000" always;
