name: tmp checar dominio
on: push
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.48.2 2>&1 | tail -3 && npx playwright install --with-deps webkit 2>&1 | tail -5
          cat > t.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const b = await webkit.launch();
          const ctx = await b.newContext({ ...devices['iPhone 13'], geolocation: { latitude: -1.45, longitude: -48.49 }, permissions: ['geolocation'] });
          const p = await ctx.newPage();
          p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log('console', m.type(), m.text().slice(0, 300)); });
          p.on('pageerror', e => console.log('pageerror', e.message));
          p.on('response', r => { const u = r.url(); if (r.status() >= 400 || u.includes('/api/')) console.log('resp', r.status(), u.slice(0, 160)); });
          p.on('requestfailed', r => console.log('failed', r.url().slice(0, 160), r.failure()?.errorText));
          await p.goto('https://app.eguaadota.com.br/app/', { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(8000);
          await p.screenshot({ path: '1-abertura.png' });
          console.log('TEXT', (await p.innerText('body')).slice(0, 1500).replace(/\n+/g, ' | '));
          for (const t of ['Pular', 'Entrar sem conta', 'Continuar sem conta', 'Explorar', 'Agora não']) {
            const l = p.getByText(t, { exact: false }).first();
            if (await l.isVisible().catch(() => false)) { console.log('click', t); await l.click(); await p.waitForTimeout(6000); await p.screenshot({ path: '2-depois-' + t.replace(/ /g,'-') + '.png' }); console.log('TEXT2', (await p.innerText('body')).slice(0, 1200).replace(/\n+/g, ' | ')); break; }
          }
          await b.close();
          JS
          node t.mjs
      - uses: actions/upload-artifact@v4
        with: { name: prints, path: t/*.png }
