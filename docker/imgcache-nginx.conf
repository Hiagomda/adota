# Cache das fotos na frente do imgproxy. As URLs são assinadas e apontam para arquivos com nome
# único (uuid), então a mesma URL sempre gera a mesma imagem: dá para guardar o resultado e não
# redimensionar de novo a cada pedido. Fica tudo na VPS, sem CDN.
proxy_cache_path /var/cache/imgproxy levels=1:2 keys_zone=fotos:20m max_size=3g inactive=7d use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # DNS interno do Docker: se o imgproxy-origin reiniciar com outro IP, o nginx acha de novo.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $origin http://imgproxy-origin:8080;
        proxy_pass $origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache fotos;
        proxy_cache_key $request_uri;
        # Foto apagada (conta excluída) some do cache em no máximo 7 dias.
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # O imgproxy manda Cache-Control de 1 ano; aqui vale o prazo de 7 dias acima.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        add_header X-Cache $upstream_cache_status always;
    }
}
