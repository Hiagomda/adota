name: patinha

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: patinha
      POSTGRES_PASSWORD: patinha
      POSTGRES_DB: patinha
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patinha -d patinha']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Official minio/minio images were removed from Docker Hub. This tag is the
  # same MinIO server, published by Bitnami and still pullable as a legacy image.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: patinha
      MINIO_ROOT_PASSWORD: patinha-secret
      MINIO_DEFAULT_BUCKETS: patinha-media
      MINIO_BROWSER: 'on'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    ports:
      - '8080:8080'
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: 'true'
      IMGPROXY_ALLOWED_SOURCES: s3://patinha-media/
      AWS_ACCESS_KEY_ID: patinha
      AWS_SECRET_ACCESS_KEY: patinha-secret
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: 'true'
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: 'true'
      IMGPROXY_STRIP_METADATA: 'true'
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
