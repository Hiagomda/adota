<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Égua, adota!</title>
    <style>
      :root {
        color-scheme: light;
        --acai: #173b3f;
        --tucuma: #f7b84b;
        --caju: #f26b4f;
        --areia: #f3e8d2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--areia);
        color: var(--acai);
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 32px;
        line-height: 1.1;
      }
      p {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.45;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        margin-top: 28px;
        border-radius: 16px;
        background: var(--caju);
        color: var(--acai);
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }
      a[hidden] {
        display: none;
      }
      a.abrir {
        background: var(--acai);
        color: var(--areia);
      }
      a.abrir + a {
        margin-top: 12px;
      }
      a[aria-disabled='true'] {
        background: #e4d4b8;
        pointer-events: none;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #4e6468;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/paw.png" alt="" />
      <h1>Égua, adota!</h1>
      <p id="texto">Teste do app de resgate de animais em Belém. O arquivo é só para Android.</p>
      <a id="abrir" class="abrir" href="#" hidden>Abrir no app</a>
      <a id="baixar" href="/egua-adota.apk" aria-disabled="true">Preparando o arquivo...</a>
      <small id="aviso">Se o botão não liberar, atualize a página daqui a pouco.</small>
    </main>
    <script>
      const botao = document.getElementById('baixar');
      const aviso = document.getElementById('aviso');
      // Post compartilhado pelo app (?post=<id>): oferece abrir no app. No Android o intent://
      // volta para esta página quando o app não está instalado.
      const post = new URLSearchParams(location.search).get('post');
      if (post && /^[A-Za-z0-9-]{1,64}$/.test(post)) {
        const abrir = document.getElementById('abrir');
        const pagina = `${location.origin}${location.pathname}`;
        abrir.href = /Android/i.test(navigator.userAgent)
          ? `intent://post/${post}#Intent;scheme=egua;package=app.egua.adota;` +
            `S.browser_fallback_url=${encodeURIComponent(pagina)};end`
          : `egua://post/${post}`;
        abrir.hidden = false;
        document.getElementById('texto').textContent =
          'Te mandaram um bichinho do Égua, adota! Já tem o app? Abre o post. Ainda não tem? Baixa e depois toca no link de novo.';
      }
      fetch('/egua-adota.apk', { method: 'HEAD' }).then((resposta) => {
        if (!resposta.ok) return;
        botao.textContent = 'Baixar o app';
        botao.setAttribute('aria-disabled', 'false');
        aviso.textContent = 'Toque no botão e confirme a instalação no Android.';
      });
    </script>
  </body>
</html>
