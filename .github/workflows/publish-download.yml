name: Publish download

# Puts the APK of the GitHub release apk-<version>-<build> on the download page without a rebuild.
# Version, build and notes come from download/version.json in this commit, so the page can never
# go back to an older build by mistake. Coolify redeploys of the download service do the same
# through docker/download.Dockerfile (APK_URL).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the published version
        id: release
        run: |
          set -eu
          version=$(jq -r '.version' download/version.json)
          build=$(jq -r '.androidVersionCode' download/version.json)
          test -n "$version" && test "$build" -gt 0
          echo "tag=apk-${version}-${build}" >> "$GITHUB_OUTPUT"
          echo "json=$(jq -c . download/version.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Update the download page
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_JSON_B64: ${{ steps.release.outputs.json }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_TAG,VERSION_JSON_B64
          script: |
            set -eu
            cid=$(docker ps --format '{{.Names}}' | grep '^download-fpmewu0com3qkbfihrsihc6y' | head -n 1)
            test -n "$cid"
            docker exec -u root "$cid" wget -O /opt/egua-adota.apk "https://github.com/Hiagomda/adota/releases/download/${RELEASE_TAG}/egua-adota.apk"
            docker exec -u root "$cid" cp -f /opt/egua-adota.apk /apk/egua-adota.apk
            echo "$VERSION_JSON_B64" | base64 -d | docker exec -i -u root "$cid" sh -c 'cat > /opt/version.json'
            docker exec -u root "$cid" cp -f /opt/version.json /apk/version.json
            # App web do iPhone do mesmo release, quando existe (releases antigos não têm).
            if docker exec -u root "$cid" wget -O /tmp/web.tar.gz "https://github.com/Hiagomda/adota/releases/download/${RELEASE_TAG}/egua-adota-web.tar.gz"; then
              docker exec -u root "$cid" sh -c 'rm -rf /tmp/app && mkdir /tmp/app && tar -xzf /tmp/web.tar.gz -C /tmp/app && rm -rf /usr/share/nginx/html/app && mv /tmp/app /usr/share/nginx/html/app && rm /tmp/web.tar.gz'
            fi
            docker exec -u root "$cid" wc -c /apk/egua-adota.apk /apk/version.json
