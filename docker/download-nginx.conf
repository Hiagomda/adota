server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # DNS interno do Docker, para achar a API e as fotos mesmo que subam depois deste nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Cabeçalhos de segurança. O nginx esquece os do server quando uma location tem add_header
    # própria, por isso cada location inclui o arquivo de novo.
    include /etc/nginx/snippets/security-headers.conf;

    location = /egua-adota.apk {
        include /etc/nginx/snippets/security-headers.conf;
        alias /apk/egua-adota.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="egua-adota.apk"';
    }

    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store";
        root /apk;
        try_files /version.json @bundled_version;
    }

    location @bundled_version {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store";
        root /usr/share/nginx/html;
        try_files /version.json =404;
    }

    # A página de download só usa o próprio site. O google.html fica sem CSP porque o login do
    # Firebase carrega scripts e iframes do Google.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # App web para iPhone (exportado do apps/mobile no workflow Compilar APK, junto com o APK).
    # O site é HTTPS e a API, as fotos e o MinIO ainda são HTTP: o Safari barraria tudo como
    # conteúdo misto, então o app chama esses serviços por caminhos daqui mesmo.
    location = /app {
        return 301 /app/;
    }

    location /app/_expo/ {
        include /etc/nginx/snippets/app-headers.conf;
        # Arquivos com hash no nome: uma versão nova sempre tem outro nome.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /app/ {
        include /etc/nginx/snippets/app-headers.conf;
        # Sem cache no index: abrir o app sempre pega o build mais novo.
        add_header Cache-Control "no-cache";
        try_files $uri /app/index.html;
    }

    location /api/ {
        set $upstream http://api:3010;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /img/ {
        set $upstream http://imgproxy:8080;
        rewrite ^/img/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Envio das fotos para o endereço assinado. A assinatura cobre o Host público do MinIO.
    location /media/ {
        set $upstream http://minio:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host ${MINIO_PUBLIC_HOST};
        proxy_request_buffering off;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
