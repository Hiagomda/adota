name: Diagnóstico VPS
on:
  push:
    branches: [diag/vps-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Serviços
        run: |
          S=fpmewu0com3qkbfihrsihc6y.86.48.25.233.sslip.io
          for u in \
            http://86.48.25.233:8000/ \
            http://api-$S/health \
            http://download-$S/ \
            https://download-$S/version.json \
            http://minio-$S/minio/health/live \
            http://imgproxy-$S/health \
            https://admin-$S/ \
            https://api.eguaadota.app/health \
            https://app.eguaadota.app/ \
            https://img.eguaadota.app/ ; do
            curl -sS -k -m 20 -o body.txt -w "%{http_code} %{time_total}s  $u\n" "$u" || echo "ERRO  $u"
            head -c 200 body.txt | tr '\n' ' '; echo; echo
          done
